; All firmware sources are local. No framework or global platform patches needed.
[platformio]
default_envs = nucleo-f767zi
src_dir = .

[env:nucleo-f767zi]
platform = ststm32@20.0.0
platform_packages = platformio/toolchain-gccarmnoneeabi@1.70201.0
board = nucleo_f767zi
extra_scripts = pre:tools/build_flags.py
monitor_speed = 115200

build_src_filter =
    -<*>
    +<src/*.c>
    +<vendor/hal/Src/*.c>
    +<vendor/cmsis_device/Source/Templates/system_stm32f7xx.c>
    +<vendor/startup/startup_stm32f767xx.s>

build_flags =
    -DUSE_HAL_DRIVER
    -DCORE_DEBUG_LEVEL=1
    -DSTM32F767xx
    -DSPL_I2S_DRIVER
    -mfpu=fpv5-d16
    -mfloat-abi=hard
    --specs=nano.specs
    --specs=nosys.specs
    -Ivendor/cmsis_core
    -Ivendor/cmsis_device/Include
    -Ivendor/hal/Inc

board_build.ldscript = vendor/linker/STM32F767ZI_FLASH.ld

[env:nucleo-f767zi-debug]
extends = env:nucleo-f767zi
build_type = debug
build_unflags = -Os
debug_build_flags = -Og -g3 -ggdb3
debug_tool = stlink
debug_init_break = tbreak main
