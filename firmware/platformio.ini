; RHYTHM – Firmware (STM32F767 / NUCLEO-F767ZI)
;
; Toolchain: PlatformIO (ststm32-Plattform: arm-gcc + stlink-Loader)
; Framework: "bar" – eigenes Framework-Skript in der ststm32-Plattform
;   (builder/frameworks/bar.py), das HAL/CMSIS/Startup aus vendor/ kompiliert.
;   Kein STM32Cube-Paket wird geladen.
;
; Einmaliges Setup (nach PlatformIO-Install):
;   1) python tools/vendor_import.py   (HAL/CMSIS/Startup nach vendor/)
;   2) python tools/patch_board.py     ('bar' zum Board hinzufügen)
;   3) bar.py + platform.json-Patch in der Plattform (siehe tools/setup_platform.py)
;
; SPL_I2S_DRIVER: HAL im "alten" SPL-Mode (I2S als Teil von SPI), passend zum
;   STM32F7xx-HAL-Driver.

[env:nucleo-f767zi]
platform = ststm32
board = nucleo_f767zi
framework = bar
monitor_speed = 115200

; src/ wird kompiliert; vendor/ wird vom Framework-Skript (bar.py) als
; separate Bibliotheken gebaut – hier nur Header-Pfade für src/.
build_src_filter =
    +<*>
    -<tools/>

build_flags =
    -DUSE_HAL_DRIVER
    -DCORE_DEBUG_LEVEL=1
    -DSTM32F767xx
    -DSPL_I2S_DRIVER
    -Wall
    -O2
    -ffunction-sections
    -fdata-sections
    -Ivendor/cmsis_core
    -Ivendor/cmsis_device/Include
    -Ivendor/hal/Inc

; Linker-Skript (repo-intern, NUCLEO-F767ZI: 2MB Flash / 512KB SRAM / 256KB CCM)
board_build.ldscript = vendor/linker/STM32F767ZI_FLASH.ld
