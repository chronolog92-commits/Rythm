; All firmware sources are local. No framework or global platform patches needed.
[platformio]
default_envs = nucleo-h753zi
project_dir = .
src_dir = .

; ---------------------------------------------------------------------------
; CURRENT (AND ONLY) DEV BOARD: ST NUCLEO-H753ZI (STM32H753) – on hand, used
; for development until the final H7 hardware arrives.
;
; CLOCK: 480 MHz (VOS0, HSI-PLL1, Overdrive) set at runtime by board_clock_init().
; The board has NO HSE. LSE (32.768 kHz) wird für CRS-Sync verwendet.
; USB 48 MHz comes from the dedicated HSI48 oscillator (USBSEL = HSI48).
; Konfiguration entspricht dem CubeMX-Referenzprojekt (tools/ST32CubeMX_project_for).
; See docs/clock-verification.md.
;
; USB: TinyUSB UAC2 device on OTG_FS (Rhport 0, interne FS-PHY, PA11/PA12).
; The legacy STM32 USB Device Audio Middleware is NOT used.
; TinyUSB sources live under vendor/tusb/ (copied from hathach/tinyusb).
; All CFG_TUSB_* settings are in src/tusb_config.h.
;
; RAM: Data/BSS/Heap/Stack in DTCM (entspricht CubeMX-Linker).
; Audio-Ringbuffer in AXI SRAM (.ram_audio_buf Sektion).
; ---------------------------------------------------------------------------
[env:nucleo-h753zi]
platform = ststm32@20.0.0
platform_packages = platformio/toolchain-gccarmnoneeabi@1.70201.0
board = nucleo_h753zi
extra_scripts = pre:tools/build_flags_h753.py
monitor_speed = 115200

; tests/ sind host-only (separat via tools/verify_timing_arm.sh) und duerfen nicht
; in den MCU-Firmware-Build. src/ + TinyUSB-Quellen werden eingebaut.
; tools/ST32CubeMX_project_for generation/ ist das CubeMX-Referenzprojekt
; (Pin-/Interrupt-Generierung) und wird bewusst NICHT in den Build eingebaut.
build_src_filter =
    +<*>
    -<tests*>
    -<tools*>
    ; system_stm32h7xx.c kommt aus src/ (CubeMX-Version), NICHT aus dem
    ; CMSIS-Template – sonst double-definition (SystemInit, SystemCoreClock, …).
    -<vendor_h753/cmsis_device/Source/Templates/system_stm32h7xx.c>
    ; TinyUSB: core, device, audio class, DWC2 port
    +<vendor/tusb/src/tusb.c>
    +<vendor/tusb/src/tusb_fifo.c>
    +<vendor/tusb/src/device/usbd.c>
    +<vendor/tusb/src/class/audio/audio_device.c>
    +<vendor/tusb/src/portable/synopsys/dwc2/dcd_dwc2.c>
    +<vendor/tusb/src/portable/synopsys/dwc2/dwc2_common.c>

build_flags =
    -DUSE_HAL_DRIVER
    -DCORE_DEBUG_LEVEL=1
    -DSTM32H753xx
    -DUSE_PWR_LDO_SUPPLY
    ; FPU (Cortex-M7)
    -mfpu=fpv5-d16
    -mfloat-abi=hard
    --specs=nano.specs
    --specs=nosys.specs
    ; Include paths
    -Ivendor_h753/cmsis_core
    -Ivendor_h753/cmsis_device/Include
    -Ivendor_h753/hal/Inc
    -Ivendor/tusb
    -Ivendor/tusb/src
    -Isrc
    -Isrc/usb

board_build.ldscript = vendor_h753/linker/STM32H753ZITX_FLASH.ld

[env:nucleo-h753zi-debug]
extends = env:nucleo-h753zi
build_type = debug
build_unflags = -Os
debug_build_flags = -Og -g3 -ggdb3
debug_tool = stlink
debug_init_break = tbreak main
