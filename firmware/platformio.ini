; All firmware sources are local. No framework or global platform patches needed.
[platformio]
default_envs = nucleo-h753zi
project_dir = .
src_dir = .

; ---------------------------------------------------------------------------
; CURRENT (AND ONLY) DEV BOARD: ST NUCLEO-H753ZI (STM32H753) – on hand, used
; for development until the final H7 hardware arrives. The H753 shares the
; STM32H7xx HAL/CMSIS family with the final H743 (identical HAL headers,
; Cortex-M7); only the part define (STM32H753xx), the startup vector table
; and the linker script differ. Vendor tree: vendor_h753/ (CMSIS device, HAL,
; startup, linker).
;
; CLOCK: The board runs 400 MHz (VOS1, HSI-PLL1) set at runtime by
; board_clock_init() (src/board_clock.c). The board has NO HSE — only LSE
; (32,768 kHz) — so PLL1 is fed by the internal HSI (64 MHz, ±1 %). The
; PlatformIO board JSON already declares f_cpu = 400000000L, matching the
; runtime clock. 480 MHz (VOS0/overdrive) is intentionally NOT set: it is
; revision-dependent (silicon) and overdriven; see docs/clock-verification.md.
; ---------------------------------------------------------------------------
[env:nucleo-h753zi]
platform = ststm32@20.0.0
platform_packages = platformio/toolchain-gccarmnoneeabi@1.70201.0
board = nucleo_h753zi
extra_scripts = pre:tools/build_flags_h753.py
monitor_speed = 115200

; tests/ sind host-only (separat via tools/verify_timing_arm.sh) und duerfen nicht
; in den MCU-Firmware-Build. src/ + Vendor-Quellen werden eingebaut.
build_src_filter =
    +<*>
    -<tests*>

build_flags =
    -DUSE_HAL_DRIVER
    -DCORE_DEBUG_LEVEL=1
    -DSTM32H7xx
    -DSPL_I2S_DRIVER
    -mfpu=fpv5-d16
    -mfloat-abi=hard
    --specs=nano.specs
    --specs=nosys.specs
    -Ivendor_h753/cmsis_core
    -Ivendor_h753/cmsis_device/Include
    -Ivendor_h753/hal/Inc

board_build.ldscript = vendor_h753/linker/STM32H753ZITX_FLASH.ld

[env:nucleo-h753zi-debug]
extends = env:nucleo-h753zi
build_type = debug
build_unflags = -Os
debug_build_flags = -Og -g3 -ggdb3
debug_tool = stlink
debug_init_break = tbreak main

; ---------------------------------------------------------------------------
; NOTE: The former F767 / H743 dev-board vendor trees (vendor_f767/,
; vendor_h743/) and their build_flags scripts were removed when the NUCLEO-H753ZI
; became the single dev board. If the final H743 target hardware is brought up
; later, a fresh vendor_h743/ tree + env should be re-added (the H743 is the
; same STM32H7xx HAL/CMSIS family; only part define, startup and linker differ).
; ---------------------------------------------------------------------------
