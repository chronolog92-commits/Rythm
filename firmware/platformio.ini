; All firmware sources are local. No framework or global platform patches needed.
[platformio]
default_envs = nucleo-h743zi
src_dir = .

; ---------------------------------------------------------------------------
; NEW DEV BOARD: ST NUCLEO-H743ZI (STM32H743) – documented final H7 platform.
; Vendor tree: vendor_h743/ (CMSIS device, HAL, startup, linker for H743).
; ---------------------------------------------------------------------------
[env:nucleo-h743zi]
platform = ststm32@20.0.0
platform_packages = platformio/toolchain-gccarmnoneeabi@1.70201.0
board = nucleo_h743zi
extra_scripts = pre:tools/build_flags_h743.py
monitor_speed = 115200

build_src_filter =
    -<*>
    +<src/*.c>
    +<vendor_h743/hal/Src/*.c>
    +<vendor_h743/cmsis_device/Source/Templates/system_stm32h7xx.c>
    +<vendor_h743/startup/startup_stm32h743xx.s>

build_flags =
    -DUSE_HAL_DRIVER
    -DCORE_DEBUG_LEVEL=1
    -DSTM32H7xx
    -DSPL_I2S_DRIVER
    -mfpu=fpv5-d16
    -mfloat-abi=hard
    --specs=nano.specs
    --specs=nosys.specs
    -Ivendor_h743/cmsis_core
    -Ivendor_h743/cmsis_device/Include
    -Ivendor_h743/hal/Inc

board_build.ldscript = vendor_h743/linker/STM32H743ZI_FLASH.ld

[env:nucleo-h743zi-debug]
extends = env:nucleo-h743zi
build_type = debug
build_unflags = -Os
debug_build_flags = -Og -g3 -ggdb3
debug_tool = stlink
debug_init_break = tbreak main

; ---------------------------------------------------------------------------
; FALLBACK: original dev board ST NUCLEO-F767ZI (STM32F767) – frozen, kept
