; RHYTHM – Firmware (STM32H743 / NUCLEO)
; Toolchain: PlatformIO + STM32Cube-HAL
; Stand: Gerüst, Pin-Map vorläufig (siehe docs/architecture.md)

[env:nucleo-f767zi]
platform = ststm32
board = nucleo_f767zi
framework = stm32cube
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=2
    -DSMP
    -Wall
    -O2
; I2S-Audio-Standard (final, 48 kHz stereo, 32-bit) – siehe bsp.h
; Debug: UART2 115200 (printf-Retarget in bsp.c)
